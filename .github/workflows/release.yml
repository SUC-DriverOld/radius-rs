# Manual release builder: dispatch with a bare version (e.g. 0.2.0), it
# tags v<version>, builds all three desktop platforms and publishes a
# GitHub release titled v<version> with two artifacts per platform:
#
#   radius-<ver>-<platform><ext>            the CLI binary
#   radius-rs-sdk-<ver>-<platform>.zip      headers + examples + libs
#
# SDK zip layout (all platforms):
#   include/radius_rs.h    the C ABI header
#   examples/              include/examples moved out beside include/
#   <platform libraries>   see the per-OS copy lists below
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Owns tag + release creation so the three build jobs never race on it.
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize and validate the version
        id: ver
        run: |
          v="${{ inputs.version }}"
          v="${v#v}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 0.1.0 (got '${{ inputs.version }}')"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::tag v$v already exists"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Create tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Release ${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes "Release ${{ steps.ver.outputs.tag }}.

          - \`radius-${{ steps.ver.outputs.version }}-<platform>\` — the CLI binary
          - \`radius-rs-sdk-${{ steps.ver.outputs.version }}-<platform>.zip\` — C ABI SDK (header, examples, libraries)" \
            --repo "$GITHUB_REPOSITORY"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macOS-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      VER: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Plain `cargo build --release` everywhere — the same command as a
      # local build. On MSVC the linker emits radius_rs.pdb alongside the
      # cdylib with the stock profile; no profile overrides (an earlier
      # CARGO_PROFILE_RELEASE_DEBUG=true here bloated the staticlib from
      # 40 MB to 180 MB and was removed for exactly that reason).
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # ---- Windows: radius-<ver>-windows-x64.exe + sdk zip ----
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $t = "target/${{ matrix.target }}/release"
          $bin = "radius-$env:VER-windows-x64.exe"
          Copy-Item "$t/radius.exe" $bin
          $stage = "sdk-stage"
          New-Item -ItemType Directory -Force "$stage/include" | Out-Null
          Copy-Item include/radius_rs.h "$stage/include/"
          Copy-Item include/examples "$stage/examples" -Recurse
          Copy-Item "$t/radius_rs.lib" "$stage/"
          Copy-Item "$t/radius_rs.dll" "$stage/"
          Copy-Item "$t/radius_rs.dll.lib" "$stage/"
          if (Test-Path "$t/radius_rs.pdb") {
            Copy-Item "$t/radius_rs.pdb" "$stage/"
          } else {
            Write-Warning "no pdb produced by the stock profile"
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "radius-rs-sdk-$env:VER-windows-x64.zip"

      # ---- macOS: radius-<ver>-macOS-arm64 + sdk zip ----
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          t="target/${{ matrix.target }}/release"
          cp "$t/radius" "radius-$VER-macOS-arm64"
          chmod +x "radius-$VER-macOS-arm64"
          stage=sdk-stage
          mkdir -p "$stage/include"
          cp include/radius_rs.h "$stage/include/"
          cp -R include/examples "$stage/examples"
          cp "$t/libradius_rs.a" "$stage/"
          cp "$t/libradius_rs.dylib" "$stage/"
          (cd "$stage" && zip -r "../radius-rs-sdk-$VER-macOS-arm64.zip" \
            include examples libradius_rs.a libradius_rs.dylib)

      # ---- Linux: radius-<ver>-linux-x64 + sdk zip ----
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          t="target/${{ matrix.target }}/release"
          cp "$t/radius" "radius-$VER-linux-x64"
          chmod +x "radius-$VER-linux-x64"
          stage=sdk-stage
          mkdir -p "$stage/include"
          cp include/radius_rs.h "$stage/include/"
          cp -R include/examples "$stage/examples"
          cp "$t/libradius_rs.a" "$stage/"
          cp "$t/libradius_rs.so" "$stage/"
          (cd "$stage" && zip -r "../radius-rs-sdk-$VER-linux-x64.zip" \
            include examples libradius_rs.a libradius_rs.so)

      - name: Upload artifacts to the release
        # bash on all three runners: it expands the `radius-*` glob (pwsh
        # passes it through literally to gh).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ needs.tag.outputs.tag }}"
          radius-* --clobber --repo "$GITHUB_REPOSITORY"
