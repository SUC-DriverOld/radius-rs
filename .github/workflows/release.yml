# Manual build: dispatch with a version (e.g. 0.2.0) to build and package
# all three desktop platforms. The packages are workflow artifacts unless
# publish_release is selected, which also tags and publishes v<version>.
#
#   radius-<ver>-<platform><ext>            the CLI binary
#   radius-rs-sdk-<ver>-<platform>.zip      headers + examples + libs
#
# SDK zip layout (all platforms):
#   include/radius_rs.h    the C ABI header
#   examples/              include/examples moved out beside include/
#   <platform libraries>   see the per-OS copy lists below
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for package names, without the v prefix (e.g. 0.2.0)"
        required: true
        type: string
      publish_release:
        description: "Publish to GitHub Releases (create and push a tag)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Normalize and validate the version
        id: ver
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          v="${VERSION_INPUT#v}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::version must look like 0.1.0'
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macOS-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Plain `cargo build --release` everywhere — the same command as a
      # local build. On MSVC the linker emits radius_rs.pdb alongside the
      # cdylib with the stock profile; no profile overrides (an earlier
      # CARGO_PROFILE_RELEASE_DEBUG=true here bloated the staticlib from
      # 40 MB to 180 MB and was removed for exactly that reason).
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check short-audio regression
        run: cargo test --release --locked --target ${{ matrix.target }} --test short_audio_regression

      - name: Check Linux ABI and loader compatibility
        if: runner.os == 'Linux'
        run: |
          t="target/${{ matrix.target }}/release"
          bash tests/linux_abi_guard.sh
          bash scripts/check-linux-abi.sh "$t/radius" 2.35
          bash scripts/check-linux-abi.sh "$t/libradius_rs.so" 2.35
          docker run --rm -v "$PWD:/work:ro" ubuntu:22.04 \
            "/work/$t/radius" --help

      # ---- Windows: radius-<ver>-windows-x64.exe + sdk zip ----
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $t = "target/${{ matrix.target }}/release"
          $bin = "radius-$env:VER-windows-x64.exe"
          Copy-Item "$t/radius.exe" $bin
          $stage = "sdk-stage"
          New-Item -ItemType Directory -Force "$stage/include" | Out-Null
          Copy-Item include/radius_rs.h "$stage/include/"
          Copy-Item include/examples "$stage/examples" -Recurse
          Copy-Item "$t/radius_rs.lib" "$stage/"
          Copy-Item "$t/radius_rs.dll" "$stage/"
          Copy-Item "$t/radius_rs.dll.lib" "$stage/"
          if (Test-Path "$t/radius_rs.pdb") {
            Copy-Item "$t/radius_rs.pdb" "$stage/"
          } else {
            Write-Warning "no pdb produced by the stock profile"
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "radius-rs-sdk-$env:VER-windows-x64.zip"

      # ---- macOS: radius-<ver>-macOS-arm64 + sdk zip ----
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          t="target/${{ matrix.target }}/release"
          cp "$t/radius" "radius-$VER-macOS-arm64"
          chmod +x "radius-$VER-macOS-arm64"
          stage=sdk-stage
          mkdir -p "$stage/include"
          cp include/radius_rs.h "$stage/include/"
          cp -R include/examples "$stage/examples"
          cp "$t/libradius_rs.a" "$stage/"
          cp "$t/libradius_rs.dylib" "$stage/"
          (cd "$stage" && zip -r "../radius-rs-sdk-$VER-macOS-arm64.zip" \
            include examples libradius_rs.a libradius_rs.dylib)

      # ---- Linux: radius-<ver>-linux-x64 + sdk zip ----
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          t="target/${{ matrix.target }}/release"
          cp "$t/radius" "radius-$VER-linux-x64"
          chmod +x "radius-$VER-linux-x64"
          stage=sdk-stage
          mkdir -p "$stage/include"
          cp include/radius_rs.h "$stage/include/"
          cp -R include/examples "$stage/examples"
          cp "$t/libradius_rs.a" "$stage/"
          cp "$t/libradius_rs.so" "$stage/"
          (cd "$stage" && zip -r "../radius-rs-sdk-$VER-linux-x64.zip" \
            include examples libradius_rs.a libradius_rs.so)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radius-build-${{ env.VER }}-${{ matrix.platform }}
          path: radius-*
          if-no-files-found: error
          overwrite: true

  publish:
    if: ${{ inputs.publish_release }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: radius-build-${{ env.VER }}-*
          path: release-assets
          merge-multiple: true
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release-assets/radius-*)
          if [[ "${#assets[@]}" -ne 6 ]]; then
            echo '::error::expected a CLI and SDK for each of the three platforms'
            exit 1
          fi

          existing_tag=$(git ls-remote --refs origin "refs/tags/$TAG")
          if [[ -n "$existing_tag" ]]; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" "${assets[@]}" --verify-tag \
            --title "$TAG" \
            --notes "Release $TAG.

          - \`radius-$VER-<platform>\`: CLI binary
          - \`radius-rs-sdk-$VER-<platform>.zip\`: C ABI SDK (header, examples, libraries)" \
            --repo "$GITHUB_REPOSITORY"
