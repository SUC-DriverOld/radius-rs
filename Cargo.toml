[package]
name = "radius-rs"
version = "0.3.0"
edition = "2021"
description = "Rust rewrite of the Radius time-domain and phase-vocoder pitch-shift engines"
readme = "README.md"
license = "LGPL-3.0-or-later"

[lib]
name = "radius_rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "radius"
path = "src/radius-rs.rs"

[features]
default = []

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rustfft = "6"
realfft = "3"
rusty_mp3 = "1.0.5"
rusty_vorbis = "0.1.2"
ogg = "0.9.2"
hound = "3.5.1"
symphonia = { version = "0.6", default-features = false, features = ["aac", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
flacenc = { version = "0.5.1", default-features = false, features = ["experimental", "par"] }

[dev-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = false
strip = true
