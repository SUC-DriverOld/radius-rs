[package]
name = "radius-rs"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of the Radius time-domain and phase-vocoder pitch-shift engines"
readme = "README.md"

[lib]
name = "radius_rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "radius"
path = "src/radius-rs.rs"

[features]
default = []

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rustfft = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = false
strip = false
